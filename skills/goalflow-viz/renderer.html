<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goalflow DAG</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.4/dist/dagre.min.js" integrity="sha384-lNbBZ8yeW7Otl9YsPLeAvfxwUjrpXOnk/ujXsbt5s9wWhKWCYzMeFdZwKBpYxeDT" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-strong: #f0f2f5;
      --text: #1f2933;
      --muted: #687482;
      --line: #c8d0d8;
      --done: #4caf50;
      --current: #2196f3;
      --next: #9e9e9e;
      --blocked: #5a5a5a;
      --committed: #fbc02d;
      --failed: #e53935;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
      background:
        linear-gradient(rgba(31, 41, 51, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 41, 51, 0.045) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
    }

    #canvas:active {
      cursor: grabbing;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 56px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(31, 41, 51, 0.08);
    }

    .brand {
      font-weight: 700;
      white-space: nowrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .meta span {
      max-width: 40vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 8;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 8px 14px;
      padding: 12px;
      border: 1px solid rgba(31, 41, 51, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.12);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      white-space: nowrap;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(31, 41, 51, 0.2);
      border-radius: 3px;
    }

    #minimap {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 8;
      width: 200px;
      height: 150px;
      border: 1px solid rgba(31, 41, 51, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.15);
      cursor: crosshair;
      touch-action: none;
    }

    .edge {
      fill: none;
      stroke: #9aa6b2;
      stroke-width: 2;
      opacity: 0.78;
    }

    .node {
      cursor: pointer;
    }

    .node rect {
      stroke: rgba(31, 41, 51, 0.28);
      stroke-width: 1.5;
      transition: filter 160ms ease, stroke-width 160ms ease;
    }

    .node:hover rect {
      filter: drop-shadow(0 8px 12px rgba(31, 41, 51, 0.22));
      stroke-width: 2;
    }

    .node.current rect {
      stroke: #0b65c2;
      stroke-width: 3;
      animation: currentPulse 1.6s ease-in-out infinite;
    }

    .node text {
      fill: #ffffff;
      font-size: 13px;
      font-weight: 700;
      paint-order: stroke;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
      stroke: rgba(31, 41, 51, 0.24);
      stroke-width: 2px;
    }

    .node.committed text,
    .node.next text {
      fill: #1f2933;
      stroke: rgba(255, 255, 255, 0.35);
    }

    @keyframes currentPulse {
      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(33, 150, 243, 0));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(33, 150, 243, 0.75));
      }
    }

    .minimap-edge {
      fill: none;
      stroke: #9aa6b2;
      stroke-width: 1;
      opacity: 0.7;
    }

    .minimap-node {
      stroke: rgba(31, 41, 51, 0.22);
      stroke-width: 0.8;
    }

    .minimap-viewport {
      fill: rgba(33, 150, 243, 0.08);
      stroke: #2196f3;
      stroke-width: 1.5;
    }

    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 19;
      display: none;
      background: rgba(31, 41, 51, 0.22);
    }

    .detail-backdrop.open {
      display: block;
    }

    .detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 20;
      width: min(420px, 100vw);
      height: 100vh;
      padding: 18px;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid rgba(31, 41, 51, 0.14);
      box-shadow: -14px 0 34px rgba(31, 41, 51, 0.18);
      transform: translateX(100%);
      transition: transform 180ms ease;
    }

    .detail-panel.open {
      transform: translateX(0);
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .detail-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .close-button {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(31, 41, 51, 0.16);
      border-radius: 6px;
      color: var(--text);
      background: var(--surface-strong);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .detail-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(31, 41, 51, 0.12);
    }

    .field {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 12px;
      margin: 9px 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .field-label {
      color: var(--muted);
      font-weight: 700;
    }

    .field-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .step-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .step {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 6px;
      background: var(--surface-strong);
      font-size: 13px;
    }

    .step-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .step-state.done {
      background: var(--done);
    }

    .step-state.pending {
      background: var(--blocked);
    }

    .step-state.failed {
      background: var(--failed);
    }

    .no-data {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      background: var(--bg);
      font-size: 18px;
      text-align: center;
    }

    .no-data.visible {
      display: flex;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
        min-height: 72px;
      }

      .meta span {
        max-width: calc(100vw - 36px);
      }

      .legend {
        grid-template-columns: 1fr;
        left: 12px;
        bottom: 12px;
      }

      #minimap {
        right: 12px;
        bottom: 12px;
        width: 160px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <svg id="canvas" aria-label="Goalflow task DAG">
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa6b2"></path>
      </marker>
    </defs>
    <g id="viewport"></g>
  </svg>

  <header class="topbar" aria-label="Graph metadata">
    <div class="brand">Goalflow DAG</div>
    <div class="meta" id="graph-meta"></div>
  </header>

  <div class="legend" aria-label="Legend">
    <div class="legend-item"><span class="swatch" style="background:#4caf50"></span><span>done</span></div>
    <div class="legend-item"><span class="swatch" style="background:#2196f3"></span><span>current</span></div>
    <div class="legend-item"><span class="swatch" style="background:#9e9e9e"></span><span>next</span></div>
    <div class="legend-item"><span class="swatch" style="background:#5a5a5a"></span><span>blocked</span></div>
    <div class="legend-item"><span class="swatch" style="background:#fbc02d"></span><span>committed</span></div>
    <div class="legend-item"><span class="swatch" style="background:#e53935"></span><span>failed</span></div>
  </div>

  <svg id="minimap" viewBox="0 0 200 150" aria-label="Minimap">
    <defs>
      <clipPath id="minimap-clip">
        <rect x="8" y="8" width="184" height="134" rx="4"></rect>
      </clipPath>
    </defs>
    <rect x="0" y="0" width="200" height="150" fill="transparent"></rect>
    <g id="minimap-content" clip-path="url(#minimap-clip)"></g>
    <rect id="minimap-viewport" class="minimap-viewport" x="0" y="0" width="0" height="0" rx="3"></rect>
  </svg>

  <div class="detail-backdrop" id="detail-backdrop"></div>
  <aside class="detail-panel" id="detail-panel" aria-label="Task detail" aria-hidden="true">
    <div class="detail-header">
      <h2 class="detail-title" id="detail-title">Task</h2>
      <button class="close-button" id="detail-close" type="button" aria-label="Close detail">&times;</button>
    </div>
    <div id="detail-content"></div>
  </aside>

  <div class="no-data" id="no-data">データなし。/goal:viz を実行してください</div>

  <script id="graph-data" type="application/json">{}</script>
  <script>
    (() => {
      "use strict";

      const DATA = JSON.parse(document.getElementById("graph-data").textContent || "{}");
      const tasksInput = Array.isArray(DATA.tasks) ? DATA.tasks : [];
      if (tasksInput.length === 0) {
        document.getElementById("no-data").classList.add("visible");
        document.getElementById("graph-meta").textContent = "";
        return;
      }

      const statusColors = {
        done: "#4caf50",
        current: "#2196f3",
        next: "#9e9e9e",
        blocked: "#5a5a5a",
        committed: "#fbc02d",
        failed: "#e53935"
      };

      const tasks = tasksInput
        .filter((task) => task && typeof task.id === "string" && task.id.length > 0)
        .map((task) => ({
          ...task,
          label: typeof task.label === "string" && task.label.length > 0 ? task.label : task.id,
          deps: Array.isArray(task.deps) ? task.deps.filter((dep) => typeof dep === "string") : [],
          targets: Array.isArray(task.targets) ? task.targets.filter((target) => typeof target === "string") : []
        }))
        .sort((a, b) => a.id.localeCompare(b.id));

      if (tasks.length === 0) {
        document.getElementById("no-data").classList.add("visible");
        document.getElementById("graph-meta").textContent = "";
        return;
      }

      const taskById = new Map(tasks.map((task) => [task.id, task]));
      const rawEdges = Array.isArray(DATA.edges)
        ? DATA.edges
        : tasks.flatMap((task) => task.deps.map((dep) => ({ from: dep, to: task.id })));
      const edges = rawEdges
        .filter((edge) => edge && taskById.has(edge.from) && taskById.has(edge.to))
        .map((edge) => ({ from: edge.from, to: edge.to }))
        .sort((a, b) => `${a.from}\u0000${a.to}`.localeCompare(`${b.from}\u0000${b.to}`));

      const meta = document.getElementById("graph-meta");
      [
        ["planSlug", DATA.planSlug],
        ["runWindow", DATA.runWindow],
        ["generatedAt", DATA.generatedAt]
      ].forEach(([label, value]) => {
        if (!value) return;
        const item = document.createElement("span");
        item.textContent = `${label}: ${value}`;
        meta.appendChild(item);
      });

      const g = new dagre.graphlib.Graph();
      g.setGraph({ rankdir: "TB", nodesep: 40, ranksep: 60, marginx: 20, marginy: 20 });
      g.setDefaultEdgeLabel(() => ({}));

      tasks.forEach((task) => {
        const label = task.label;
        g.setNode(task.id, {
          task,
          label,
          width: Math.max(140, label.length * 9),
          height: 44
        });
      });

      edges.forEach(({ from, to }) => {
        g.setEdge(from, to);
      });

      dagre.layout(g);
      // v1 expects lane=null and renders a single top-to-bottom flow. Future lane ints can offset ranked nodes into horizontal lanes here.

      const graphNodes = tasks.map((task) => {
        const node = g.node(task.id);
        const displayState = deriveDisplayState(task, taskById);
        return {
          ...node,
          id: task.id,
          task,
          displayState,
          fill: statusColors[displayState]
        };
      });
      const graphEdges = g.edges().map((edge) => ({
        from: edge.v,
        to: edge.w,
        points: (g.edge(edge).points || []).map((point) => ({ x: point.x, y: point.y }))
      }));

      const bounds = computeBounds(graphNodes, graphEdges);
      const svg = d3.select("#canvas");
      const viewport = d3.select("#viewport");
      const edgeLine = d3.line()
        .x((point) => point.x)
        .y((point) => point.y)
        .curve(d3.curveBasis);

      viewport.append("g")
        .attr("class", "edges")
        .selectAll("path")
        .data(graphEdges)
        .join("path")
        .attr("class", "edge")
        .attr("d", (edge) => edgeLine(edge.points))
        .attr("marker-end", "url(#arrowhead)");

      const nodeGroups = viewport.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(graphNodes)
        .join("g")
        .attr("class", (node) => `node ${node.displayState}`)
        .attr("transform", (node) => `translate(${node.x - node.width / 2},${node.y - node.height / 2})`)
        .on("click", (event, node) => {
          event.stopPropagation();
          openDetail(node.task);
        });

      nodeGroups.append("rect")
        .attr("width", (node) => node.width)
        .attr("height", (node) => node.height)
        .attr("rx", 6)
        .attr("fill", (node) => node.fill);

      nodeGroups.append("text")
        .attr("x", (node) => node.width / 2)
        .attr("y", (node) => node.height / 2 + 1)
        .text((node) => fitLabel(node.label, node.width));

      nodeGroups.append("title")
        .text((node) => `${node.id}: ${node.label}`);

      const minimap = d3.select("#minimap");
      const minimapContent = d3.select("#minimap-content");
      const minimapViewport = d3.select("#minimap-viewport");
      const minimapSize = { width: 200, height: 150, pad: 12 };
      let currentTransform = d3.zoomIdentity;
      const mini = createMiniScale(bounds, minimapSize);

      minimapContent.append("g")
        .selectAll("path")
        .data(graphEdges)
        .join("path")
        .attr("class", "minimap-edge")
        .attr("d", (edge) => edgeLine(edge.points.map(toMiniPoint)));

      minimapContent.append("g")
        .selectAll("rect")
        .data(graphNodes)
        .join("rect")
        .attr("class", "minimap-node")
        .attr("x", (node) => mini.x(node.x - node.width / 2))
        .attr("y", (node) => mini.y(node.y - node.height / 2))
        .attr("width", (node) => node.width * mini.scale)
        .attr("height", (node) => node.height * mini.scale)
        .attr("rx", 2)
        .attr("fill", (node) => node.fill);

      const zoomBehavior = d3.zoom()
        .scaleExtent([0.1, 4])
        .on("zoom", (event) => {
          currentTransform = event.transform;
          viewport.attr("transform", currentTransform);
          updateMinimapViewport();
        });

      svg.call(zoomBehavior);
      svg.on("click", closeDetail);
      window.addEventListener("resize", () => {
        svg.call(zoomBehavior.transform, fitTransform(bounds));
      });

      minimap
        .on("click", (event) => {
          event.stopPropagation();
          panToMinimapEvent(event, true);
        })
        .call(d3.drag()
          .on("start", (event) => {
            event.sourceEvent.stopPropagation();
            panToMinimapEvent(event.sourceEvent, false);
          })
          .on("drag", (event) => {
            event.sourceEvent.stopPropagation();
            panToMinimapEvent(event.sourceEvent, false);
          }));

      svg.call(zoomBehavior.transform, fitTransform(bounds));

      document.getElementById("detail-close").addEventListener("click", closeDetail);
      document.getElementById("detail-backdrop").addEventListener("click", closeDetail);
      document.getElementById("detail-panel").addEventListener("click", (event) => event.stopPropagation());

      function deriveDisplayState(task, byId) {
        if (task.status === "verified") return "done";
        if (task.status === "running") return "current";
        if (task.status === "committed") return "committed";
        if (task.status === "failed") return "failed";

        const deps = Array.isArray(task.deps) ? task.deps : [];
        const allDepsVerified = deps.every((dep) => byId.get(dep)?.status === "verified");
        return allDepsVerified ? "next" : "blocked";
      }

      function computeBounds(nodes, edgeList) {
        const values = [];
        nodes.forEach((node) => {
          values.push(
            [node.x - node.width / 2, node.y - node.height / 2],
            [node.x + node.width / 2, node.y + node.height / 2]
          );
        });
        edgeList.forEach((edge) => {
          edge.points.forEach((point) => values.push([point.x, point.y]));
        });
        const xs = values.map(([x]) => x);
        const ys = values.map(([, y]) => y);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        return {
          minX,
          minY,
          maxX,
          maxY,
          width: Math.max(1, maxX - minX),
          height: Math.max(1, maxY - minY)
        };
      }

      function fitTransform(graphBounds) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const topOffset = document.querySelector(".topbar").getBoundingClientRect().height;
        const padding = width < 720 ? 42 : 80;
        const availableWidth = Math.max(1, width - padding * 2);
        const availableHeight = Math.max(1, height - topOffset - padding * 2);
        const scale = Math.max(0.1, Math.min(4, availableWidth / graphBounds.width, availableHeight / graphBounds.height));
        const x = (width - graphBounds.width * scale) / 2 - graphBounds.minX * scale;
        const y = topOffset + (height - topOffset - graphBounds.height * scale) / 2 - graphBounds.minY * scale;
        return d3.zoomIdentity.translate(x, y).scale(scale);
      }

      function createMiniScale(graphBounds, size) {
        const availableWidth = size.width - size.pad * 2;
        const availableHeight = size.height - size.pad * 2;
        const scale = Math.min(availableWidth / graphBounds.width, availableHeight / graphBounds.height);
        const offsetX = (size.width - graphBounds.width * scale) / 2 - graphBounds.minX * scale;
        const offsetY = (size.height - graphBounds.height * scale) / 2 - graphBounds.minY * scale;
        return {
          scale,
          x: (x) => x * scale + offsetX,
          y: (y) => y * scale + offsetY,
          invertX: (x) => (x - offsetX) / scale,
          invertY: (y) => (y - offsetY) / scale
        };
      }

      function toMiniPoint(point) {
        return {
          x: mini.x(point.x),
          y: mini.y(point.y)
        };
      }

      function updateMinimapViewport() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const graphX0 = (0 - currentTransform.x) / currentTransform.k;
        const graphY0 = (0 - currentTransform.y) / currentTransform.k;
        const graphX1 = (width - currentTransform.x) / currentTransform.k;
        const graphY1 = (height - currentTransform.y) / currentTransform.k;
        const x = mini.x(graphX0);
        const y = mini.y(graphY0);
        const rectWidth = (graphX1 - graphX0) * mini.scale;
        const rectHeight = (graphY1 - graphY0) * mini.scale;
        minimapViewport
          .attr("x", x)
          .attr("y", y)
          .attr("width", rectWidth)
          .attr("height", rectHeight);
      }

      function panToMinimapEvent(event, animate) {
        const [mx, my] = d3.pointer(event, minimap.node());
        const graphX = mini.invertX(mx);
        const graphY = mini.invertY(my);
        const next = d3.zoomIdentity
          .translate(window.innerWidth / 2 - graphX * currentTransform.k, window.innerHeight / 2 - graphY * currentTransform.k)
          .scale(currentTransform.k);
        const selection = animate ? svg.transition().duration(160) : svg;
        selection.call(zoomBehavior.transform, next);
      }

      function fitLabel(label, width) {
        const maxChars = Math.max(6, Math.floor((width - 24) / 8));
        return label.length > maxChars ? `${label.slice(0, maxChars - 1)}...` : label;
      }

      function openDetail(task) {
        const panel = document.getElementById("detail-panel");
        const backdrop = document.getElementById("detail-backdrop");
        const title = document.getElementById("detail-title");
        const content = document.getElementById("detail-content");

        title.textContent = task.label || task.id;
        content.replaceChildren(
          fieldsSection([
            ["id", task.id],
            ["label", task.label || ""],
            ["tier", task.tier || ""],
            ["targets", formatList(task.targets)],
            ["deps", formatList(task.deps)],
            ["lane", task.lane === null || task.lane === undefined ? "null" : String(task.lane)],
            ["status", task.status || "pending"]
          ]),
          substepsSection(task.status)
        );

        backdrop.classList.add("open");
        panel.classList.add("open");
        panel.setAttribute("aria-hidden", "false");
      }

      function closeDetail() {
        const panel = document.getElementById("detail-panel");
        const backdrop = document.getElementById("detail-backdrop");
        backdrop.classList.remove("open");
        panel.classList.remove("open");
        panel.setAttribute("aria-hidden", "true");
      }

      function fieldsSection(rows) {
        const fragment = document.createDocumentFragment();
        rows.forEach(([label, value]) => {
          const row = document.createElement("div");
          row.className = "field";
          const name = document.createElement("div");
          name.className = "field-label";
          name.textContent = label;
          const fieldValue = document.createElement("div");
          fieldValue.className = "field-value";
          fieldValue.textContent = value || "-";
          row.append(name, fieldValue);
          fragment.appendChild(row);
        });
        const wrapper = document.createElement("div");
        wrapper.appendChild(fragment);
        return wrapper;
      }

      function substepsSection(status) {
        const section = document.createElement("div");
        section.className = "detail-section";
        const heading = document.createElement("div");
        heading.className = "field-label";
        heading.textContent = "サブステップ";
        const list = document.createElement("div");
        list.className = "step-list";

        [
          ["codex", ["running", "committed", "verified", "failed"].includes(status) ? "done" : "pending"],
          ["commit", ["committed", "verified", "failed"].includes(status) ? "done" : "pending"],
          ["verify", status === "verified" ? "done" : status === "failed" ? "failed" : "pending"]
        ].forEach(([name, state]) => {
          const step = document.createElement("div");
          step.className = "step";
          const stepName = document.createElement("div");
          stepName.textContent = name;
          const stepState = document.createElement("div");
          stepState.className = `step-state ${state}`;
          stepState.textContent = state;
          step.append(stepName, stepState);
          list.appendChild(step);
        });

        section.append(heading, list);
        return section;
      }

      function formatList(value) {
        return Array.isArray(value) && value.length > 0 ? value.join(", ") : "-";
      }
    })();
  </script>
</body>
</html>
